<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SEDEC Browser Source Test Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="canvas" aria-label="SEDEC browser source test card">
      <div class="safe-area" aria-hidden="true"></div>
      <div class="crosshair" aria-hidden="true"></div>
      <section class="label">
        <p class="eyebrow">Browser source / 1920 × 1080</p>
        <h1>SEDEC LIVESTREAMING</h1>
        <p>オーバーレイの位置・縮尺・セーフエリア確認用</p>
      </section>
      <p class="safe-area-label">10% safe area</p>
      <div class="scale" aria-hidden="true">
        <span>0</span>
        <span>25</span>
        <span>50</span>
        <span>75</span>
        <span>100</span>
      </div>
    </main>
  </body>
</html>
